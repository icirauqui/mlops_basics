name: Course checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.7'
          python-version: '3.12'
      - run: uv sync --locked --all-extras
      - run: uv run --all-extras pytest -q
      - run: uv run tools/verify_notebooks.py
      - name: Build the shared runtime
        run: docker build --platform linux/amd64 -t iris-course:ci .
      - name: Verify container training and inference
        run: uv run tools/verify_container.py --image iris-course:ci
